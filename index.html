<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Positions</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
<link rel="icon" href="apple-touch-icon.png?v=3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Positions" />
<meta name="theme-color" content="#0B0507" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14" />
</head>
<body>

  <div class="scene">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="vignette"></div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle neon theme" title="Toggle neon theme">&#10022;</button>

    <!-- SPLIT LANDING SCREEN -->
    <section id="screen-split" class="screen active split-screen">
      <button id="split-positions" class="split-half split-positions">
        <span class="split-label">Positions</span>
      </button>
      <button id="split-game" class="split-half split-game">
        <span class="split-label">Game</span>
      </button>
    </section>

    <!-- HOME / TIER SELECT SCREEN -->
    <section id="screen-home" class="screen">
      <div class="draw-topbar">
        <button id="back-split-home" class="icon-btn" aria-label="Back to menu">←</button>
      </div>
      <p class="eyebrow">for two</p>
      <h1 class="title">Positions</h1>
      <p class="subtitle">Pick your difficulty. We'll pick the rest.</p>

      <div class="tier-grid">
        <button class="tier-card" data-tier="Easy">
          <span class="tier-num">I</span>
          <span class="tier-name">Easy</span>
        </button>
        <button class="tier-card" data-tier="Medium">
          <span class="tier-num">II</span>
          <span class="tier-name">Medium</span>
        </button>
        <button class="tier-card" data-tier="Hard">
          <span class="tier-num">III</span>
          <span class="tier-name">Hard</span>
        </button>
        <button class="tier-card" data-tier="Extreme">
          <span class="tier-num">IV</span>
          <span class="tier-name">Extreme</span>
        </button>
      </div>

      <button id="open-gallery" class="gallery-link">View all positions</button>
    </section>

    <!-- DRAW SCREEN -->
    <section id="screen-draw" class="screen">
      <div class="draw-topbar">
        <button id="back-home" class="icon-btn" aria-label="Back to menu">←</button>
        <select id="tier-select" class="tier-select" aria-label="Switch difficulty"></select>
      </div>

      <div class="card-frame">
        <div id="position-image-wrap" class="position-image-wrap">
          <img id="position-image" class="position-image" alt="" />
          <div id="position-placeholder" class="position-placeholder">✦</div>
        </div>
        <p id="position-text" class="position-text"></p>
      </div>

      <div class="draw-actions">
        <button id="shuffle-btn" class="draw-btn secondary">
          <span class="compass">
            <span class="needle"></span>
          </span>
          <span class="draw-label">Shuffle</span>
        </button>
        <button id="done-btn" class="draw-btn primary">
          <span class="check-mark">✓</span>
          <span class="draw-label">Done</span>
        </button>
      </div>
    </section>

    <!-- GALLERY SCREEN -->
    <section id="screen-gallery" class="screen">
      <div class="draw-topbar">
        <button id="back-home-2" class="icon-btn" aria-label="Back to menu">←</button>
        <select id="gallery-tier-select" class="tier-select" aria-label="Filter by difficulty">
          <option value="All">All</option>
        </select>
      </div>
      <p class="gallery-progress" id="gallery-progress"></p>
      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <!-- PLAYER NAMES SCREEN -->
    <section id="screen-names" class="screen">
      <div class="draw-topbar">
        <button id="back-split-names" class="icon-btn" aria-label="Back to menu">←</button>
      </div>
      <h2 class="section-title">Who's playing?</h2>
      <p class="subtitle">Enter both names to continue.</p>
      <form id="names-form" class="names-form">
        <input id="player1-input" class="name-input" type="text" placeholder="Player 1 name" maxlength="20" required />
        <input id="player2-input" class="name-input" type="text" placeholder="Player 2 name" maxlength="20" required />
        <button type="submit" class="draw-btn primary names-submit">
          <span class="check-mark">✓</span>
          <span class="draw-label">Start</span>
        </button>
      </form>
    </section>

    <!-- GAME PICK SCREEN -->
    <section id="screen-game-pick" class="screen">
      <div class="draw-topbar">
        <button id="back-split-gamepick" class="icon-btn" aria-label="Back to menu">←</button>
        <button class="icon-btn game-settings-btn" aria-label="Game settings" title="Change player names">⚙</button>
      </div>
      <h2 class="section-title">Pick your game</h2>
      <div id="game-list" class="game-list"></div>
    </section>

    <!-- GAME PLAY (PLACEHOLDER) SCREEN -->
    <section id="screen-game-play" class="screen">
      <div class="draw-topbar">
        <button id="back-game-pick" class="icon-btn" aria-label="Back to game list">←</button>
        <button class="icon-btn game-settings-btn" aria-label="Game settings" title="Change player names">⚙</button>
      </div>
      <h2 id="game-play-title" class="section-title"></h2>
      <p id="game-play-players" class="subtitle"></p>
      <p class="position-text game-play-note">This game's rules are coming soon.</p>
    </section>

    <!-- TRUTH OR DARE — STARTING DIFFICULTY -->
    <section id="screen-tod-start" class="screen">
      <div class="draw-topbar">
        <button id="back-tod-start" class="icon-btn" aria-label="Back to game list">←</button>
        <button class="icon-btn game-settings-btn" aria-label="Game settings" title="Change player names">⚙</button>
      </div>
      <p class="eyebrow">truth or dare</p>
      <h1 class="title tod-title">Pick your start</h1>
      <p class="subtitle">You can level up later.</p>

      <div class="tier-grid">
        <button class="tier-card tod-start-tier" data-tier="Easy">
          <span class="tier-num">I</span>
          <span class="tier-name">Easy</span>
        </button>
        <button class="tier-card tod-start-tier" data-tier="Medium">
          <span class="tier-num">II</span>
          <span class="tier-name">Medium</span>
        </button>
        <button class="tier-card tod-start-tier" data-tier="Hard">
          <span class="tier-num">III</span>
          <span class="tier-name">Hard</span>
        </button>
        <button class="tier-card tod-start-tier" data-tier="Extreme">
          <span class="tier-num">IV</span>
          <span class="tier-name">Extreme</span>
        </button>
      </div>
    </section>

    <!-- TRUTH OR DARE SCREEN -->
    <section id="screen-tod" class="screen">
      <div class="draw-topbar">
        <button id="back-tod" class="icon-btn" aria-label="Back to game list">←</button>
        <select id="tod-tier-select" class="tier-select" aria-label="Switch difficulty"></select>
        <button class="icon-btn game-settings-btn" aria-label="Game settings" title="Change player names">⚙</button>
      </div>
      <p class="eyebrow" id="tod-turn"></p>
      <h1 class="title tod-title">Truth or Dare</h1>

      <div id="tod-choice" class="tod-choice">
        <button id="tod-truth-btn" class="draw-btn secondary tod-choice-btn" type="button">
          <span class="draw-label">Truth</span>
        </button>
        <button id="tod-dare-btn" class="draw-btn primary tod-choice-btn" type="button">
          <span class="draw-label">Dare</span>
        </button>
      </div>

      <div id="tod-reveal" class="card-frame tod-reveal hidden">
        <p id="tod-kind" class="tod-kind"></p>
        <p id="tod-text" class="position-text"></p>
      </div>

      <button id="tod-next-btn" class="draw-btn primary tod-next hidden" type="button">
        <span class="check-mark">✓</span>
        <span class="draw-label">Next turn</span>
      </button>

      <div id="tod-levelup" class="card-frame tod-levelup hidden">
        <p id="tod-levelup-text" class="position-text"></p>
        <div class="tod-levelup-actions">
          <button id="tod-levelup-no" class="draw-btn secondary" type="button">
            <span class="draw-label">Stay here</span>
          </button>
          <button id="tod-levelup-yes" class="draw-btn primary" type="button">
            <span class="draw-label">Level up</span>
          </button>
        </div>
      </div>
    </section>

    <!-- DICE GAME SCREEN -->
    <section id="screen-dice" class="screen">
      <div class="draw-topbar">
        <button id="back-dice" class="icon-btn" aria-label="Back to game list">←</button>
        <button class="icon-btn game-settings-btn" aria-label="Game settings" title="Change player names">⚙</button>
      </div>
      <p class="eyebrow" id="dice-turn"></p>
      <h1 class="title tod-title">Dice Game</h1>

      <div class="dice-row">
        <div class="die-scene">
          <div id="die-cube-1" class="die-cube">
            <div class="die-face die-face-front"></div>
            <div class="die-face die-face-back"></div>
            <div class="die-face die-face-right"></div>
            <div class="die-face die-face-left"></div>
            <div class="die-face die-face-top"></div>
            <div class="die-face die-face-bottom"></div>
          </div>
        </div>
        <div class="die-scene">
          <div id="die-cube-2" class="die-cube">
            <div class="die-face die-face-front"></div>
            <div class="die-face die-face-back"></div>
            <div class="die-face die-face-right"></div>
            <div class="die-face die-face-left"></div>
            <div class="die-face die-face-top"></div>
            <div class="die-face die-face-bottom"></div>
          </div>
        </div>
      </div>

      <button id="dice-roll-btn" class="draw-btn primary dice-roll" type="button">
        <span class="compass">
          <span class="needle"></span>
        </span>
        <span class="draw-label">Roll</span>
      </button>

      <p id="dice-result" class="position-text dice-result hidden"></p>

      <button id="dice-next-btn" class="draw-btn primary tod-next hidden" type="button">
        <span class="check-mark">✓</span>
        <span class="draw-label">Next turn</span>
      </button>
    </section>

    <!-- GAME SETTINGS SCREEN -->
    <section id="screen-game-settings" class="screen">
      <div class="draw-topbar">
        <button id="back-game-settings" class="icon-btn" aria-label="Back">←</button>
      </div>
      <h2 class="section-title">Game settings</h2>
      <p class="subtitle">Update player names.</p>
      <form id="settings-form" class="names-form">
        <input id="settings-player1-input" class="name-input" type="text" placeholder="Player 1 name" maxlength="20" required />
        <input id="settings-player2-input" class="name-input" type="text" placeholder="Player 2 name" maxlength="20" required />
        <button type="submit" class="draw-btn primary names-submit">
          <span class="check-mark">✓</span>
          <span class="draw-label">Save</span>
        </button>
      </form>
    </section>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
    }
    if (window.caches && caches.keys) {
      caches.keys().then((names) => names.forEach((n) => caches.delete(n)));
    }
  </script>
  <script src="data.js?v=3"></script>
  <script src="script.js?v=15"></script>
</body>
</html>
